name: Backend CI (ASP.NET Core 9)

on:
  push:
    branches: [ main, develop, "feat/**" ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore apps/backend/Pulse.sln

    - name: Build solution
      run: dotnet build apps/backend/Pulse.sln --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test apps/backend/Pulse.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

