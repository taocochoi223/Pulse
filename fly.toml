# fly.toml app configuration file for Pulse Backend (.NET 9 + SignalR WebRTC Hub)
app = "pulse-team-api"
primary_region = "sin"

[build]
  dockerfile = "infra/docker/Dockerfile.backend"

[env]
  ASPNETCORE_URLS = "http://+:8080"
  ASPNETCORE_ENVIRONMENT = "Production"
  JWT_ISSUER = "PulseAuthServer"
  JWT_AUDIENCE = "PulseClientApp"
  ALLOWED_ORIGINS = "*"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
